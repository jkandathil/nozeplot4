# Deploy MCU compile bridge to Google Cloud Run (optional — needs GCP_SA_KEY + GCP_PROJECT_ID secrets).
name: Deploy MCU compile bridge

on:
  push:
    branches: [main]
    paths:
      - 'tools/arduino-compile-server/**'
      - '.github/workflows/deploy-mcu-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-run:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.gcp.outputs.enabled == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outputs.enabled == 'true'

      - name: Build and deploy to Cloud Run
        if: steps.gcp.outputs.enabled == 'true'
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE: noze-mcu-compile-bridge
        run: |
          gcloud builds submit tools/arduino-compile-server \
            --project "$PROJECT" \
            --tag "gcr.io/$PROJECT/$SERVICE"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "gcr.io/$PROJECT/$SERVICE" \
            --platform managed \
            --allow-unauthenticated \
            --port 8787 \
            --memory 2Gi \
            --timeout 300 \
            --max-instances 3 \
            --min-instances 0

      - id: url
        if: steps.gcp.outputs.enabled == 'true'
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE: noze-mcu-compile-bridge
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "MCU compile bridge → $URL"
