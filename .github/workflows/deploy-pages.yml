# On push to main: build with Firebase + deploy dist/ to branch gh-pages.
# FeNOse weights are not in the repo (gitignored); users train or upload models in-app to workspace Model/.
#
# If the four required Firebase secrets are missing, CI still builds using placeholders; the live site
# shows "Firebase is not configured" until you add secrets and redeploy. Add the VITE_FIREBASE_* secrets
# below for a working sign-in build.
#
# Access control: only emails whose domain is VITE_ALLOWED_EMAIL_DOMAIN (noze.ca below)
# pass AuthGate after Google or email/password sign-in.
#
# 1) GitHub → Settings → Secrets and variables → Actions → New repository secret:
#    VITE_FIREBASE_API_KEY
#    VITE_FIREBASE_AUTH_DOMAIN   (e.g. nozeplots4.firebaseapp.com)
#    VITE_FIREBASE_PROJECT_ID
#    VITE_FIREBASE_APP_ID
#    Optional: VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_AUTH_PUBLIC_URL
#
# 2) Firebase → Authentication → Settings → Authorized domains:
#    add  YOUR_USERNAME.github.io
#
# 3) Google Cloud → Credentials → OAuth Web client → Authorized JavaScript origins:
#    add  https://YOUR_USERNAME.github.io
#    add  https://YOUR_USERNAME.github.io/nozeplot4   (if your Vite base path is /nozeplot4/)
#
# 4) GitHub → Settings → Pages → Source: Deploy from branch → gh-pages / root
#
# Secret scanning: Firebase VITE_FIREBASE_API_KEY is embedded in dist/ JS on purpose (Firebase Web SDK).
# If GitHub emails about “Google API Key” in gh-pages assets, restrict/rotate the key in Google Cloud
# (HTTP referrer restrictions). Optionally close the alert after review — it will reappear on new deploys
# unless GitHub offers an allowlist for your org/repo.
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        env:
          # Missing secrets → placeholders so the build completes; AuthGate shows not configured until real values are set.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || '__FIREBASE_NOT_CONFIGURED__' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || '__FIREBASE_NOT_CONFIGURED__' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || '__FIREBASE_NOT_CONFIGURED__' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '__FIREBASE_NOT_CONFIGURED__' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_ALLOWED_EMAIL_DOMAIN: noze.ca
          # Optional: override if repo name ≠ URL path (otherwise app uses window.location on the live site)
          VITE_AUTH_PUBLIC_URL: ${{ secrets.VITE_AUTH_PUBLIC_URL }}
        run: |
          npm ci
          node scripts/checkFirebaseBuildEnv.mjs
          npm run build

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
