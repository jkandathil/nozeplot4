# On push to main: build with Firebase + deploy dist/ to branch gh-pages.
# FeNOse weights are not in the repo (gitignored); users train or upload models in-app to workspace Model/.
#
# Default Firebase web config is inlined below (same as .env.example / local dev) so Pages works without
# repo secrets. These are public client identifiers; restrict abuse in Google Cloud → Credentials → your
# browser key (HTTP referrers). Set repository secrets to override any value (e.g. after key rotation).
#
# Access control: only emails whose domain is VITE_ALLOWED_EMAIL_DOMAIN (noze.ca below)
# pass AuthGate after Google or email/password sign-in.
#
# 1) GitHub → Settings → Secrets and variables → Actions → New repository secret:
#    VITE_FIREBASE_API_KEY
#    VITE_FIREBASE_AUTH_DOMAIN   (e.g. nozeplots4.firebaseapp.com)
#    VITE_FIREBASE_PROJECT_ID
#    VITE_FIREBASE_APP_ID
#    Optional: VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_AUTH_PUBLIC_URL
#
# 2) Firebase → Authentication → Settings → Authorized domains:
#    add  YOUR_USERNAME.github.io
#
# 3) Google Cloud → Credentials → OAuth Web client → Authorized JavaScript origins:
#    add  https://YOUR_USERNAME.github.io
#    add  https://YOUR_USERNAME.github.io/nozeplot4   (if your Vite base path is /nozeplot4/)
#
# 4) GitHub → Settings → Pages → Source: Deploy from branch → gh-pages / root
#
# Secret scanning: Firebase VITE_FIREBASE_API_KEY is embedded in dist/ JS on purpose (Firebase Web SDK).
# If GitHub emails about “Google API Key” in gh-pages assets, restrict/rotate the key in Google Cloud
# (HTTP referrer restrictions). Optionally close the alert after review — it will reappear on new deploys
# unless GitHub offers an allowlist for your org/repo.
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        env:
          # Secrets override defaults (defaults = nozeplots4 web app; public client config, same as shipped JS).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDjMDLpyK6dRaqjYQe-w19VJmvOLJTwcrU' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'nozeplots4.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'nozeplots4' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:467315626009:web:1a6a310a870e775c88da88' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'nozeplots4.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '467315626009' }}
          VITE_ALLOWED_EMAIL_DOMAIN: noze.ca
          VITE_AUTH_PUBLIC_URL: ${{ secrets.VITE_AUTH_PUBLIC_URL || 'https://jkandathil.github.io/nozeplot4' }}
        run: |
          npm ci
          node scripts/checkFirebaseBuildEnv.mjs
          npm run build

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
