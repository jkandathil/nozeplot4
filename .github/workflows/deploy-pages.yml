# On push to main: optionally deploy MCU compile bridge, build app, deploy to gh-pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mcu-bridge:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy compile bridge to Cloud Run
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}

      - name: Build and deploy bridge image
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE: noze-mcu-compile-bridge
        run: |
          gcloud builds submit tools/arduino-compile-server \
            --project "$PROJECT" \
            --tag "gcr.io/$PROJECT/$SERVICE"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "gcr.io/$PROJECT/$SERVICE" \
            --platform managed \
            --allow-unauthenticated \
            --port 8787 \
            --memory 2Gi \
            --timeout 300 \
            --max-instances 3 \
            --min-instances 0

      - id: url
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          SERVICE: noze-mcu-compile-bridge
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ] && [ -n "$PROJECT" ]; then
            BRIDGE_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)
            echo "url=$BRIDGE_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: deploy-mcu-bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDjMDLpyK6dRaqjYQe-w19VJmvOLJTwcrU' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'nozeplots4.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'nozeplots4' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:467315626009:web:1a6a310a870e775c88da88' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'nozeplots4.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '467315626009' }}
          VITE_ALLOWED_EMAIL_DOMAIN: noze.ca
          VITE_AUTH_PUBLIC_URL: ${{ secrets.VITE_AUTH_PUBLIC_URL || 'https://jkandathil.github.io/nozeplot4' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_MCU_COMPILE_URL: ${{ needs.deploy-mcu-bridge.outputs.url || secrets.VITE_MCU_COMPILE_URL }}
        run: |
          npm ci
          node scripts/checkFirebaseBuildEnv.mjs
          npm run build

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
