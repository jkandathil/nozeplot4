<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Minimal Oscilloscope Screen -->
  <rect x="15" y="25" width="70" height="50" rx="6" />
  
  <!-- Grid Lines -->
  <path d="M 15 50 L 85 50 M 50 25 L 50 75" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="2 2" />
  
  <!-- Sharp waveform line -->
  <path d="M 20 50 L 35 50 L 45 30 L 55 65 L 65 40 L 75 50 L 80 50" stroke-width="2" stroke-linejoin="miter" />

  <!-- Left horizontal connector line -->
  <path d="M 0 50 L 15 50" stroke-width="2" />
</svg>